<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#f59e0b">
    <!-- center handle -->
    <rect x="204" y="242" width="104" height="28" rx="14"/>
    <!-- grip collars -->
    <rect x="186" y="228" width="18" height="56" rx="8"/>
    <rect x="308" y="228" width="18" height="56" rx="8"/>
    <!-- inner plates (largest, nearest the grip) -->
    <rect x="150" y="166" width="36" height="180" rx="16"/>
    <rect x="326" y="166" width="36" height="180" rx="16"/>
    <!-- outer plates (smaller, at the ends) -->
    <rect x="120" y="191" width="30" height="130" rx="13"/>
    <rect x="362" y="191" width="30" height="130" rx="13"/>
  </g>
</svg>
